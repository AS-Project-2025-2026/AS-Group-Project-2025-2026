services:
  nopcommerce_web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - nopcommerce_app_data:/app/App_Data
    restart: on-failure
    depends_on:
      nopcommerce_database:
        condition: service_healthy

  nopcommerce_database:
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    environment:
      SA_PASSWORD: "nopCommerce_db_password"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    volumes:
      - nopcommerce_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || bash -c '</dev/tcp/localhost/1433'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: "rabbitmq:3-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  warehouse_stub:
    build:
      context: ./src/Stubs/WarehouseStub
    ports:
      - "5081:8080"
    environment:
      STUB_MODE: ${WAREHOUSE_STUB_MODE:-normal}
      STUB_DELAY_MS: ${WAREHOUSE_STUB_DELAY_MS:-0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  shipping_stub:
    build:
      context: ./src/Stubs/ShippingStub
    ports:
      - "5082:8080"
    environment:
      STUB_MODE: ${SHIPPING_STUB_MODE:-normal}
      STUB_DELAY_MS: ${SHIPPING_STUB_DELAY_MS:-0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  inventory_stub:
    build:
      context: ./src/Stubs/InventoryStub
    ports:
      - "5083:8080"
    environment:
      STUB_MODE: ${INVENTORY_STUB_MODE:-normal}
      STUB_DELAY_MS: ${INVENTORY_STUB_DELAY_MS:-0}
      STUB_PRODUCT_IDS: ${INVENTORY_STUB_PRODUCT_IDS:-1,2,3,4,5}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  storepos_stub:
    build:
      context: ./src/Stubs/StorePosStub
    ports:
      - "5084:8080"
    environment:
      STUB_MODE: ${STOREPOS_STUB_MODE:-normal}
      STUB_DELAY_MS: ${STOREPOS_STUB_DELAY_MS:-0}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: verdemart.integration
      POS_STOCK_ROUTING_KEY: pos.stock.reported
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  customersupport_stub:
    build:
      context: ./src/Stubs/CustomerSupportStub
    ports:
      - "5085:8080"
    environment:
      STUB_MODE: ${CUSTOMERSUPPORT_STUB_MODE:-normal}
      STUB_DELAY_MS: ${CUSTOMERSUPPORT_STUB_DELAY_MS:-0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  integration_worker:
    build:
      context: .
      dockerfile: src/Integration/Nop.IntegrationWorker/Dockerfile
    environment:
      ConnectionStrings__ConnectionString: "Server=nopcommerce_database,1433;Database=NopCommerce;User Id=sa;Password=nopCommerce_db_password;TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__Exchange: verdemart.integration
      RabbitMq__FulfillmentQueue: fulfillment.requests
      RabbitMq__ShippingQueue: shipping.requests
      RabbitMq__StoreOpsQueue: storeops.requests
      RabbitMq__PosStockQueue: pos.stock.updates
      Warehouse__BaseUrl: http://warehouse_stub:8080
      Shipping__BaseUrl: http://shipping_stub:8080
      Inventory__BaseUrl: http://inventory_stub:8080
      Inventory__SyncIntervalSeconds: ${INVENTORY_SYNC_INTERVAL:-30}
      Inventory__StalenessThresholdSeconds: ${INVENTORY_STALENESS_THRESHOLD:-120}
      Inventory__ConflictToleranceUnits: ${INVENTORY_CONFLICT_TOLERANCE:-2}
      Inventory__SourceSystem: wms
      StorePos__BaseUrl: http://storepos_stub:8080
      CustomerSupport__BaseUrl: http://customersupport_stub:8080
      Worker__PollingIntervalSeconds: ${WORKER_POLLING_INTERVAL:-5}
      Worker__BatchSize: ${WORKER_BATCH_SIZE:-20}
      Resilience__InitialDelaySeconds: ${RESILIENCE__INITIALDELAYSECONDS:-2}
      Resilience__MaxDelaySeconds: ${RESILIENCE__MAXDELAYSECONDS:-300}
      Resilience__MaxRetryAttempts: ${RESILIENCE__MAXRETRYATTEMPTS:-10}
      Resilience__CircuitFailureThreshold: ${RESILIENCE__CIRCUITFAILURETHRESHOLD:-5}
      Resilience__CircuitCooldownSeconds: ${RESILIENCE__CIRCUITCOOLDOWNSECONDS:-300}
      Metrics__Port: 9100
    expose:
      - "9100"
    depends_on:
      nopcommerce_database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      warehouse_stub:
        condition: service_healthy
      shipping_stub:
        condition: service_healthy
      inventory_stub:
        condition: service_healthy
      storepos_stub:
        condition: service_healthy
      customersupport_stub:
        condition: service_healthy
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nopcommerce_web
      - integration_worker
    restart: on-failure

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: on-failure

  loki:
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: on-failure

  promtail:
    image: grafana/promtail:3.2.0
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: on-failure

volumes:
  nopcommerce_data:
  nopcommerce_app_data:
  grafana_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
