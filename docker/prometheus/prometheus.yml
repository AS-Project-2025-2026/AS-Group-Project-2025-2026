global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: nopcommerce_web
    metrics_path: /metrics
    static_configs:
      - targets:
          - nopcommerce_web:80

  - job_name: integration_worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - integration_worker:9100
