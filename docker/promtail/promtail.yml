server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      # Use the container name as the job label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Use the compose service name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Keep the compose project name
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      # Parse the .NET structured log format: "info: Namespace[0]\n       message"
      - multiline:
          firstline: '^\w+:'
          max_wait_time: 3s
      # Extract log level from start of line
      - regex:
          expression: '^(?P<level>info|warn|fail|dbug|crit|trce):\s+(?P<logger>\S+)\[(?P<event_id>\d+)\]'
      - labels:
          level:
          logger:
      # Extract correlation/order IDs for trace linking
      - regex:
          expression: '(?P<correlation_id>order-\d+[^\s,]*)'
      - labels:
          correlation_id:
      # Extract adapter names for filtering
      - regex:
          expression: '(?i)adapter[=\s]+(?P<adapter>warehouse|shipping|inventory|storepos|customersupport|rabbitmq)'
      - labels:
          adapter:
